version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - n8n_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password_change_me
      
      # n8n Configuration
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      
      # Optional: Encryption key for sensitive data (generate your own)
      - N8N_ENCRYPTION_KEY=your_encryption_key_here_minimum_32_chars_long
      
      # Optional: API Keys (set these for security)
      # - N8N_API_KEY=your_api_key_here
    
    ports:
      - "5678:5678"
    
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - n8n_network
    
    restart: unless-stopped
    
    # Expose port for webhooks
    expose:
      - 5678

volumes:
  n8n_data:
  postgres_data:

networks:
  n8n_network:
    driver: bridge
